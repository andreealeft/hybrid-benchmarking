<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hybrid-benchmarking</title>
<style>
  :root {
    --ground: #f7f8fa; --surface: #fff; --sunk: #eef0f4;
    --ink: #15181f; --muted: #565e70; --faint: #838b9a;
    --rule: #dde1e9; --accent: #1d4e6f; --accent-soft: #e4edf3;
    --warn: #9a5a2e; --warn-soft: #f7ece3; --good: #2c6152;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101319; --surface: #171b23; --sunk: #1e232c;
      --ink: #e6e9ef; --muted: #a0a8b8; --faint: #7b8494;
      --rule: #2a303b; --accent: #7fb4d4; --accent-soft: #1a2c39;
      --warn: #d19a6e; --warn-soft: #2c2119; --good: #7fbba6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    background: var(--surface);
  }
  header h1 { font-family: var(--mono); font-size: 1rem; font-weight: 600; margin: 0; }
  header p { margin: 0; color: var(--faint); font-size: .82rem; }
  main { display: grid; grid-template-columns: 1fr; gap: 0; min-height: calc(100vh - 60px); }
  @media (min-width: 900px) { main { grid-template-columns: 290px minmax(0,1fr); } }

  /* ---- list ---- */
  nav { border-right: 1px solid var(--rule); background: var(--surface); padding: .9rem; }
  #filter {
    width: 100%; padding: .5rem .65rem; font: inherit; color: var(--ink);
    background: var(--ground); border: 1px solid var(--rule); border-radius: 4px;
  }
  #filter:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  ul { list-style: none; margin: .8rem 0 0; padding: 0; }
  li button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    font: inherit; color: var(--ink); padding: .4rem .55rem; border-radius: 4px;
    display: flex; justify-content: space-between; gap: .5rem; align-items: baseline;
  }
  li button:hover { background: var(--sunk); }
  li button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  li button span { font-family: var(--mono); font-size: .78rem; color: var(--faint); }
  li button[aria-current="true"] span { color: var(--accent); }

  /* ---- detail ---- */
  article { padding: 1.4rem 1.6rem 4rem; max-width: 900px; }
  h2 { font-family: var(--mono); font-size: 1.25rem; margin: 0 0 .35rem; font-weight: 600; }
  .summary { color: var(--muted); margin: 0 0 1.2rem; max-width: 68ch; }
  h3 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--faint); margin: 1.6rem 0 .55rem; font-weight: 700;
  }
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .tabs button {
    font: inherit; font-size: .82rem; padding: .3rem .7rem; cursor: pointer;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--rule); border-radius: 999px;
  }
  .tabs button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--ground);
  }
  pre {
    background: var(--sunk); border: 1px solid var(--rule); border-radius: 5px;
    padding: .8rem .9rem; overflow-x: auto; font-family: var(--mono);
    font-size: .8rem; margin: 0 0 1rem; line-height: 1.45;
  }
  .meta { font-size: .82rem; color: var(--muted); margin: 0 0 .5rem; }
  .meta b { color: var(--ink); font-weight: 600; }
  ul.notes { margin: 0 0 1rem; padding-left: 1.1rem; color: var(--muted); font-size: .85rem; }
  ul.notes li { margin-bottom: .25rem; }
  .pill {
    display: inline-block; font-size: .72rem; padding: .12rem .5rem; border-radius: 999px;
    background: var(--sunk); color: var(--muted); font-family: var(--mono);
  }
  .pill.hard { background: var(--warn-soft); color: var(--warn); }

  /* ---- form ---- */
  form { display: grid; gap: .7rem; margin-bottom: 1rem; }
  .field { display: grid; grid-template-columns: 1fr; gap: .2rem; }
  @media (min-width: 620px) { .field { grid-template-columns: 170px 1fr; align-items: center; gap: .8rem; } }
  .field label { font-family: var(--mono); font-size: .82rem; color: var(--accent); }
  .field input {
    font: inherit; font-family: var(--mono); font-size: .84rem; padding: .4rem .55rem;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px; width: 100%;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  button.primary {
    font: inherit; font-weight: 600; padding: .45rem 1.1rem; cursor: pointer;
    background: var(--accent); color: var(--ground);
    border: 1px solid var(--accent); border-radius: 4px;
  }
  button.ghost {
    font: inherit; padding: .45rem .9rem; cursor: pointer; color: var(--muted);
    background: none; border: 1px solid var(--rule); border-radius: 4px;
  }

  /* ---- result ---- */
  .result { border-left: 3px solid var(--accent); background: var(--surface); padding: .9rem 1.1rem; margin-bottom: 1rem; }
  .result.bad { border-left-color: var(--warn); background: var(--warn-soft); }
  .value { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; }
  .value small { font-size: .8rem; font-weight: 400; color: var(--muted); margin-left: .4rem; }
  .warn { color: var(--warn); font-size: .85rem; margin: .5rem 0 0; }
  /* The hand-logging path, folded away where the instance form can do the job.
     Still one click, because plenty of people arrive already holding a log. */
  details.secondary { margin-top: 1.6rem; border-top: 1px solid var(--rule);
    padding-top: .8rem; }
  details.secondary > summary { cursor: pointer; font-size: .85rem;
    color: var(--muted); }
  details.secondary[open] > summary { margin-bottom: .6rem; }
  .none { color: var(--faint); font-style: italic; }
  .term {
    border: 1px solid var(--rule); border-radius: 6px; background: var(--surface);
    padding: .8rem .9rem; margin-bottom: .6rem;
  }
  .term .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  select {
    font: inherit; font-family: var(--mono); font-size: .82rem; padding: .35rem .5rem;
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px; max-width: 100%;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .slot {
    margin: .55rem 0 0 1rem; padding-left: .8rem;
    border-left: 2px solid var(--accent-soft);
  }
  .slot > .label {
    font-family: var(--mono); font-size: .76rem; color: var(--accent);
    display: block; margin-bottom: .3rem;
  }
  .drop { background: none; border: 0; color: var(--faint); cursor: pointer; font: inherit; }
  .drop:hover { color: var(--warn); }
  .op { font-family: var(--mono); color: var(--faint); margin: 0 0 .6rem; }
  .route {
    border: 1px solid var(--rule); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; background: var(--surface);
    padding: .9rem 1.1rem; margin-bottom: .7rem; cursor: pointer;
  }
  .route[aria-pressed="true"] { background: var(--accent-soft); }
  .route h4 { margin: 0 0 .3rem; font-size: .95rem; }
  .route p { margin: 0 0 .4rem; color: var(--muted); font-size: .87rem; max-width: 70ch; }
  .route .model { color: var(--warn); font-size: .82rem; margin: 0; }
  .caution {
    border-left: 3px solid var(--warn); background: var(--warn-soft);
    padding: .8rem 1rem; margin: 0 0 1.2rem; font-size: .87rem; max-width: 70ch;
  }
  textarea {
    font-family: var(--mono); font-size: .8rem; width: 100%; min-height: 7rem;
    padding: .6rem; background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sub { color: var(--faint); font-size: .8rem; font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>hybrid-benchmarking</h1>
  <p>Quantum subroutines and what they cost. Nothing leaves this machine.</p>
  <div class="tabs" id="modes" style="margin-left:auto">
    <button data-mode="problems" aria-pressed="true">Problems</button>
    <button data-mode="build" aria-pressed="false">Build</button>
    <button data-mode="browse" aria-pressed="false">Subroutines</button>
  </div>
</header>

<main>
  <nav>
    <input id="filter" type="search" placeholder="Filter routines" autocomplete="off">
    <ul id="list"></ul>
  </nav>
  <article id="detail"><p class="none">Loading the registry…</p></article>
  <article id="builder" hidden></article>
  <article id="problems"><p class="none">Loading…</p></article>
</main>

<script>
const EXAMPLES = {
  X: "1000000", t: "1", p: "0.25", p_0: "0.0001",
  d: "4", kappa: "10", epsilon: "1e-8", delta: "1e-3",
  N: "1000", x_norm: "1", A_max: "1", A_1: "3", t_sim: "100",
  n: "200", m: "50", c_max: "2", u_norm: "1.5",
  bits: "8", capacity: "7", profit_bound: "11",
  profits: "[6, 2, 1, 2]", weights: "[2, 2, 1, 5]",
  schedule: "[[6, [1, 2]], [9, [1]]]",
  layers: "[1, 3, 5, 2]", phases: "[[1, 3, 5, 2], [1, 2, 4]]",
  inner_gates: "1", inner_gates_2: "1", oracle_gates: "1",
  prepare_gates: "1", n_qubits: "10", ancillas: "4", terms: "64",
};

let catalogue = [], current = null, chosenImpl = null, chosenUnit = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function boot() {
  catalogue = await (await fetch("/api/routines")).json();
  drawList();
  select("QSearch");
}

function drawList() {
  const needle = $("filter").value.toLowerCase();
  const shown = catalogue.filter(r =>
    !needle || r.name.toLowerCase().includes(needle) ||
    r.summary.toLowerCase().includes(needle));
  $("list").innerHTML = shown.map(r => `
    <li><button data-name="${esc(r.name)}"
        aria-current="${r.name === (current && current.name)}">
      <span style="font-family:var(--sans);color:inherit">${esc(r.name)}</span>
      <span>${r.units.length ? r.units.map(u => u[0]).join("") : "–"}</span>
    </button></li>`).join("");
  $("list").querySelectorAll("button").forEach(b =>
    b.onclick = () => select(b.dataset.name));
}

async function select(name) {
  const data = await (await fetch("/api/routine/" + encodeURIComponent(name))).json();
  if (data.error) { $("detail").innerHTML = `<p class="none">${esc(data.error)}</p>`; return; }
  current = data;
  chosenImpl = data.implementations[0];
  chosenUnit = chosenImpl.units[0] || null;
  drawList();
  drawDetail();
}

function drawDetail() {
  const r = current, impl = chosenImpl;
  const cost = chosenUnit ? impl.costs[chosenUnit] : null;
  const multi = r.implementations.length > 1;

  let html = `<h2>${esc(r.name)}</h2><p class="summary">${esc(r.summary)}</p>`;

  if (multi) {
    html += `<h3>Construction</h3><div class="tabs" id="impls">` +
      r.implementations.map(i =>
        `<button data-impl="${esc(i.name)}" aria-pressed="${i === impl}">${esc(i.name)}</button>`
      ).join("") + `</div><p class="meta">${esc(impl.summary)}</p>`;
  }

  if (impl.citation) html += `<p class="meta"><b>Source</b> ${esc(impl.citation)}</p>`;
  if (impl.built_from.length)
    html += `<p class="meta"><b>Built from</b> ${impl.built_from.map(esc).join(", ")}</p>`;

  if (!impl.units.length) {
    html += `<h3>Cost</h3><p class="none">This entry has no cost of its own —
      it is the unit other costs are counted in.</p>`;
  } else {
    html += `<h3>Counted in</h3><div class="tabs" id="units">` +
      impl.units.map(u =>
        `<button data-unit="${u}" aria-pressed="${u === chosenUnit}">${esc(impl.costs[u].unit_label)}</button>`
      ).join("") + `</div>`;
  }

  if (r.missing && Object.keys(r.missing).length) {
    html += `<ul class="notes">` + Object.entries(r.missing).map(([u, why]) =>
      `<li><b>${u.toLowerCase()}</b> — ${esc(why)}</li>`).join("") + `</ul>`;
  }

  if (cost) {
    html += `<h3>Formula</h3><pre>${esc(cost.formula)}</pre>`;
    html += `<p class="meta"><b>${esc(cost.bound)}</b>, ${esc(cost.derivation)}</p>`;
    if (cost.assumptions.length)
      html += `<h3>Assuming</h3><ul class="notes">` +
        cost.assumptions.map(a => `<li>${esc(a)}</li>`).join("") + `</ul>`;
    if (cost.conditions.length)
      html += `<h3>Valid where</h3><ul class="notes">` + cost.conditions.map(c =>
        `<li>${esc(c.message)} <span class="pill${c.hard ? " hard" : ""}">${
          c.hard ? "required" : "regime"}</span></li>`).join("") + `</ul>`;

    html += `<h3>Evaluate</h3><form id="params">` +
      cost.parameters.map(p => `<div class="field">
        <label for="f_${p}">${esc(p)}</label>
        <input id="f_${p}" name="${esc(p)}" value="${esc(EXAMPLES[p] || "")}"
               placeholder="${esc(EXAMPLES[p] || "number, or JSON for a vector")}">
      </div>`).join("") +
      `<div class="actions">
         <button class="primary" type="submit">Evaluate</button>
         <button class="ghost" type="button" id="copy">Copy as code</button>
       </div></form><div id="out"></div>`;
  }

  $("detail").innerHTML = html;

  if (multi) $("impls").querySelectorAll("button").forEach(b => b.onclick = () => {
    chosenImpl = current.implementations.find(i => i.name === b.dataset.impl);
    chosenUnit = chosenImpl.units[0] || null;
    drawDetail();
  });
  const units = $("units");
  if (units) units.querySelectorAll("button").forEach(b => b.onclick = () => {
    chosenUnit = b.dataset.unit; drawDetail();
  });
  const form = $("params");
  if (form) {
    form.onsubmit = (e) => { e.preventDefault(); run(); };
    $("copy").onclick = () => run(true);
  }
}

function collect() {
  const values = {};
  new FormData($("params")).forEach((v, k) => { if (String(v).trim()) values[k] = v; });
  return values;
}

async function run(copyOnly) {
  const path = chosenImpl.name === "default"
    ? current.name : current.name + "/" + chosenImpl.name;
  const body = { path, unit: chosenUnit, values: collect() };
  const res = await (await fetch("/api/evaluate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  })).json();

  if (res.error) {
    $("out").innerHTML = `<div class="result bad"><b>Cannot evaluate</b>
      <p class="warn">${esc(res.error)}</p></div>`;
    return;
  }
  if (copyOnly) {
    navigator.clipboard && navigator.clipboard.writeText(res.snippet);
    $("out").innerHTML = `<h3>Copied</h3><pre>${esc(res.snippet)}</pre>`;
    return;
  }
  $("out").innerHTML = `
    <div class="result">
      <div class="value">${res.value.toPrecision(6)}<small>${esc(res.unit_label)}</small></div>
      <p class="meta" style="margin:.4rem 0 0">${esc(res.provenance)}</p>
      ${res.warnings.map(w => `<p class="warn">⚠ ${esc(w)}</p>`).join("")}
    </div>
    <h3>The same call, as code</h3><pre>${esc(res.snippet)}</pre>`;
}

$("filter").oninput = drawList;

/* ------------------------------------------------------------------ build */

let ENTRIES = [], detailCache = {}, spec = null;

async function entryDetail(path) {
  if (!detailCache[path])
    detailCache[path] = await (await fetch("/api/routine/" + encodeURIComponent(path))).json();
  return detailCache[path];
}

function costOf(data, unit) {
  if (data.costs) return data.costs[unit];                 // an implementation
  for (const impl of data.implementations || [])           // a routine
    if (impl.costs[unit]) return impl.costs[unit];
  return null;
}

function unitsOf(path) {
  const found = ENTRIES.find(e => e.path === path);
  return found ? found.units : [];
}

async function boot_build() {
  ENTRIES = await (await fetch("/api/entries")).json();
  spec = { op: "+", terms: [blank()] };
  drawBuilder();
}

const blank = () => ({ routine: "", unit: "", bind: {} });

function options(paths, chosen) {
  return [`<option value="">choose…</option>`].concat(paths.map(p =>
    `<option value="${esc(p)}" ${p === chosen ? "selected" : ""}>${esc(p)}</option>`
  )).join("");
}

async function renderNode(node, address, allowed) {
  const paths = allowed || ENTRIES.map(e => e.path);
  let html = `<div class="row">
    <select data-pick="${address}">${options(paths, node.routine)}</select>`;
  if (node.routine) {
    const units = unitsOf(node.routine);
    html += `<select data-unit="${address}">` + units.map(u =>
      `<option value="${u}" ${u === node.unit ? "selected" : ""}>${u.toLowerCase()}</option>`
    ).join("") + `</select>`;
  }
  html += `</div>`;

  if (node.routine && node.unit) {
    const data = await entryDetail(node.routine);
    const cost = costOf(data, node.unit);
    const slots = (cost && cost.slots) || {};
    for (const [slot, unit] of Object.entries(slots)) {
      const filled = node.bind[slot];
      const choices = await (await fetch("/api/fillings/" + unit)).json();
      html += `<div class="slot"><span class="label">${esc(slot)} — takes ${unit.toLowerCase()}</span>`;
      if (filled) {
        html += await renderNode(filled, address + ".bind." + slot, choices);
        html += `<button class="drop" data-clear="${address}.bind.${slot}">leave empty (cost per call)</button>`;
      } else {
        html += `<div class="row"><select data-fill="${address}.bind.${slot}">
          ${options(choices, "")}</select>
          <span class="pill">empty — counts calls</span></div>`;
      }
      html += `</div>`;
    }
  }
  return html;
}

function at(address) {
  let node = spec;
  for (const step of address.split(".").filter(Boolean)) {
    node = /^\d+$/.test(step) ? node.terms[+step] : node[step];
  }
  return node;
}

function setAt(address, value) {
  const steps = address.split(".").filter(Boolean);
  const last = steps.pop();
  let node = spec;
  for (const step of steps) node = /^\d+$/.test(step) ? node.terms[+step] : node[step];
  if (value === null) delete node[last]; else node[last] = value;
}

async function drawBuilder() {
  let html = `<h2>Build an algorithm</h2>
    <p class="summary">Assemble routines the way the published analyses are
    assembled. A wrapper left empty reports how many times it calls something;
    fill its slot and you get the composite, carrying the union of the
    parameters and the weaker of the two bound directions.</p>`;

  html += `<h3>Terms, combined by
    <select id="op">
      <option value="+" ${spec.op === "+" ? "selected" : ""}>+ (one after another)</option>
      <option value="*" ${spec.op === "*" ? "selected" : ""}>× (repetitions × what is repeated)</option>
    </select></h3>`;

  for (let i = 0; i < spec.terms.length; i++) {
    html += `<div class="term">` + await renderNode(spec.terms[i], String(i));
    if (spec.terms.length > 1)
      html += `<button class="drop" data-remove="${i}">remove this term</button>`;
    html += `</div>`;
  }
  html += `<div class="actions" style="margin-bottom:1.2rem">
      <button class="ghost" type="button" id="add">Add a term</button>
    </div><div id="assembled"></div>`;

  $("builder").innerHTML = html;
  wireBuilder();
  refreshAssembled();
}

function wireBuilder() {
  const b = $("builder");
  b.querySelectorAll("[data-pick]").forEach(el => el.onchange = () => {
    const node = at(el.dataset.pick);
    node.routine = el.value; node.bind = {};
    node.unit = unitsOf(el.value)[0] || "";
    drawBuilder();
  });
  b.querySelectorAll("[data-unit]").forEach(el => el.onchange = () => {
    const node = at(el.dataset.unit);
    node.unit = el.value; node.bind = {};
    drawBuilder();
  });
  b.querySelectorAll("[data-fill]").forEach(el => el.onchange = () => {
    if (!el.value) return;
    setAt(el.dataset.fill, { routine: el.value, unit: unitsOf(el.value)[0] || "", bind: {} });
    drawBuilder();
  });
  b.querySelectorAll("[data-clear]").forEach(el => el.onclick = () => {
    setAt(el.dataset.clear, null); drawBuilder();
  });
  b.querySelectorAll("[data-remove]").forEach(el => el.onclick = () => {
    spec.terms.splice(+el.dataset.remove, 1); drawBuilder();
  });
  $("op").onchange = () => { spec.op = $("op").value; refreshAssembled(); };
  $("add").onclick = () => { spec.terms.push(blank()); drawBuilder(); };
}

function ready(node) {
  if (!node.routine || !node.unit) return false;
  return Object.values(node.bind || {}).every(ready);
}

async function refreshAssembled() {
  const out = $("assembled");
  if (!spec.terms.every(ready)) {
    out.innerHTML = `<p class="none">Choose a routine and a unit for every term.</p>`;
    return;
  }
  const res = await (await fetch("/api/compose", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ spec }),
  })).json();

  if (res.error) {
    out.innerHTML = `<div class="result bad"><b>These do not combine</b>
      <p class="warn">${esc(res.error)}</p></div>`;
    return;
  }

  let html = `<h3>Assembled</h3>
    <p class="meta"><b>${esc(res.bound)}</b>, ${esc(res.derivation)},
      counted in ${esc(res.unit_label)}</p>`;
  if (Object.keys(res.open_slots).length)
    html += `<p class="meta">Slots left empty: ` + Object.entries(res.open_slots)
      .map(([s, u]) => `<span class="pill">${esc(s)} (${u.toLowerCase()})</span>`)
      .join(" ") + ` — these stay as parameters, so the result counts calls.</p>`;
  if (res.sources.length)
    html += `<h3>Drawing on</h3><ul class="notes">` +
      res.sources.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>`;
  if (res.assumptions.length)
    html += `<h3>Assuming, in total</h3><ul class="notes">` +
      res.assumptions.map(a => `<li>${esc(a)}</li>`).join("") + `</ul>`;
  if (res.conditions.length)
    html += `<h3>Valid where</h3><ul class="notes">` + res.conditions.map(c =>
      `<li>${esc(c.message)} <span class="pill${c.hard ? " hard" : ""}">${
        c.hard ? "required" : "regime"}</span></li>`).join("") + `</ul>`;

  html += `<h3>Evaluate</h3><form id="cparams">` + res.parameters.map(p =>
    `<div class="field"><label for="c_${p}">${esc(p)}</label>
      <input id="c_${p}" name="${esc(p)}" value="${esc(EXAMPLES[p] || "")}"
             placeholder="${esc(EXAMPLES[p] || "number, or JSON for a vector")}"></div>`
  ).join("") + `<div class="actions">
      <button class="primary" type="submit">Evaluate</button>
    </div></form><div id="cout"></div>
    <h3>The same composition, as code</h3><pre>${esc(res.snippet)}</pre>`;

  out.innerHTML = html;
  $("cparams").onsubmit = (e) => { e.preventDefault(); runComposition(); };
}

async function runComposition() {
  const values = {};
  new FormData($("cparams")).forEach((v, k) => { if (String(v).trim()) values[k] = v; });
  const res = await (await fetch("/api/compose/evaluate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ spec, values }),
  })).json();
  if (res.error) {
    $("cout").innerHTML = `<div class="result bad"><b>Cannot evaluate</b>
      <p class="warn">${esc(res.error)}</p></div>`;
    return;
  }
  $("cout").innerHTML = `<div class="result">
      <div class="value">${res.value.toPrecision(6)}<small>${esc(res.unit_label)}</small></div>
      <p class="meta" style="margin:.4rem 0 0">${esc(res.provenance)}</p>
      ${res.warnings.map(w => `<p class="warn">⚠ ${esc(w)}</p>`).join("")}
    </div><pre>${esc(res.snippet)}</pre>`;
}

/* --------------------------------------------------------------- problems */

let PROBLEMS = [], problem = null, route = null, logText = "";

async function boot_problems() {
  PROBLEMS = await (await fetch("/api/problems")).json();
  drawProblemList();
  pickProblem(PROBLEMS[0].key);
}

function drawProblemList() {
  $("list").innerHTML = PROBLEMS.map(p => `
    <li><button data-problem="${esc(p.key)}"
        aria-current="${p.key === (problem && problem.key)}"
        style="display:block">
      <span style="font-family:var(--sans);color:inherit">${esc(p.label)}</span>
      <span style="display:block;font-size:.74rem">${esc(p.technical)}</span>
    </button></li>`).join("");
  $("list").querySelectorAll("button").forEach(b =>
    b.onclick = () => pickProblem(b.dataset.problem));
}

async function pickProblem(key) {
  problem = await (await fetch("/api/problem/" + key)).json();
  route = null; logText = "";
  drawProblemList();
  drawProblem();
}

function drawProblem() {
  const p = problem;
  let html = `<h2>${esc(p.label)}</h2>
    <p class="sub">${esc(p.technical)}</p>
    <p class="summary">${esc(p.blurb)}</p>`;

  if (p.incomparable) html += `<div class="caution"><b>These routes are not
    comparable with one another.</b> Each rests on a different cost model and a
    different set of assumptions, so the numbers answer different questions.
    Read each with the note attached to it.</div>`;

  html += `<h3>Ways to attack it</h3>` + p.routes.map(r => `
    <div class="route" data-route="${esc(r.key)}" aria-pressed="${r === route}">
      <h4>${esc(r.label)} <span class="pill">${esc(r.unit_label)}</span></h4>
      <p><b>${esc(r.classical)}</b> solves this classically. The quantum version
         replaces ${esc(r.replaces)}.</p>
      <p class="model">${esc(r.note)}</p>
    </div>`).join("");

  html += `<div id="routebody"></div>`;
  $("problems").innerHTML = html;
  $("problems").querySelectorAll(".route").forEach(el => el.onclick = () => {
    route = problem.routes.find(r => r.key === el.dataset.route);
    drawProblem();
  });
  if (route) drawRoute();
}

async function drawRoute() {
  const r = route;
  const tpl = await (await fetch(
    `/api/template/${problem.key}/${r.key}?${r.per_record.some(f => !f.example.startsWith("[")) ? "csv" : "json"}`)).text();

  let html = "";

  if (r.generated) html += `<h3>Give it an instance file</h3>
    <p class="meta">That is the whole input. ${esc(r.classical)} runs here,
      instrumented, works out the quantities the bound needs, and the answer is
      a ${esc(r.unit_label)} count. Accepts ${esc(r.accepts || "an instance file")}.
      Nothing is uploaded and nothing is installed — the file is read where it
      sits, and you see the log it produced before you see the number.</p>
    <form id="genform">
      <div class="field">
        <label for="genpath">file</label>
        <input id="genpath" name="instance"
               placeholder="${esc(r.example_file || "/path/to/instance")}">
      </div>
      <div class="field">
        <label for="genbudget">seconds</label>
        <input id="genbudget" name="budget" value="300"
               title="How long the classical run may take. A run cut off part
                      way still produces a log, marked as one.">
      </div>`
      + r.chosen.map(f => `
      <div class="field"><label for="gen_${f.name}">${esc(f.label)}</label>
        <input id="gen_${f.name}" name="${esc(f.name)}" value="${esc(f.example)}"
               title="${esc(f.help)}"></div>`).join("")
      + `<div class="actions">
           <button class="primary" type="submit">Run it and cost it</button>
         </div>
    </form><div id="genout"></div>`;

  // Where the instance form exists it is the answer, so the hand-logging path
  // folds away behind it. Left open and equally weighted it reads as an
  // instruction to go and instrument a solver yourself, which is the dead end
  // this panel was built to remove.
  if (r.generated) html += `<details class="secondary">
    <summary>I already have a log, or I want to produce one myself</summary>`;

  html += `<h3>${r.generated ? "The shape of a log" : "What to log"}</h3>
    <p class="meta">${r.generated ? "If you would rather run" : "Run"}
      ${esc(r.classical)} ${r.generated ? "yourself" : "on your instance with logging"},
      record ${r.whole_run ? "the run" : "one row per iteration"} in this shape.
      Every column is named below.</p>
    <pre>${esc(tpl)}</pre>`;

  html += `<h3>Your log</h3>
    <form id="logform">
      <div class="field">
        <label for="logpath">file</label>
        <input id="logpath" name="path" placeholder="/path/to/your-log.csv">
      </div>
      <p class="meta" style="margin:0">Read where it sits — nothing is uploaded,
        the server is on this machine. Or paste it:</p>
      <textarea id="logtext" placeholder="paste a log here instead"></textarea>`;

  if (r.chosen.length) html += r.chosen.map(f => `
      <div class="field"><label for="ch_${f.name}">${esc(f.label)}</label>
        <input id="ch_${f.name}" name="${esc(f.name)}" value="${esc(f.example)}"
               title="${esc(f.help)}"></div>`).join("");

  html += `<div class="actions"><button class="primary" type="submit">Cost this run</button></div>
    </form><div id="logout"></div>`;
  if (r.generated) html += `</details>`;

  document.getElementById("routebody").innerHTML = html;
  $("logform").onsubmit = (e) => { e.preventDefault(); runLog(); };
  if (r.generated)
    $("genform").onsubmit = (e) => { e.preventDefault(); runInstance(); };
}

function costHtml(res) {
  return `<div class="result">
      <div class="value">${res.total.toPrecision(6)}<small>${esc(res.unit_label)}</small></div>
      <p class="meta" style="margin:.4rem 0 0">
        ${res.whole_run ? "for the whole run" :
          `summed over ${res.records} iterations · largest single one
           ${res.largest.toPrecision(4)}`}</p>
      <p class="meta" style="margin:.2rem 0 0">${esc(res.provenance)}</p>
      ${(res.warnings || []).map(w => `<p class="warn">⚠ ${esc(w)}</p>`).join("")}
    </div>
    <p class="model" style="color:var(--warn);font-size:.85rem">${esc(res.note || "")}</p>
    <h3>The same run, as code</h3><pre>${esc(res.snippet)}</pre>`;
}

async function runInstance() {
  const chosen = {};
  route.chosen.forEach(f => {
    const el = document.getElementById("gen_" + f.name);
    if (el && el.value.trim()) chosen[f.name] = el.value;
  });
  $("genout").innerHTML = `<p class="meta">running ${esc(route.classical)}…</p>`;

  const res = await (await fetch("/api/problem/generate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      problem: problem.key, route: route.key, chosen,
      instance: $("genpath").value.trim(),
      budget: parseFloat($("genbudget").value) || 300,
    }),
  })).json();

  if (res.error && !res.log) {
    $("genout").innerHTML = `<div class="result bad"><b>Cannot run this</b>
      <p class="warn">${esc(res.error)}</p></div>`;
    return;
  }

  // The log first, always. Skipping past it to the number would make this an
  // oracle, which is the one thing the whole tool is arranged not to be.
  let html = `<p class="meta">${esc(res.instance)} — ${esc(res.implementation)}</p>
    <p class="meta">${esc(res.status)} in ${res.elapsed}s`
    + (Object.keys(res.result || {}).length ? " · " + Object.entries(res.result)
        .map(([k, v]) => esc(k.replace(/_/g, " ") + " " + v)).join(" · ") : "")
    + `</p>`;
  if (res.advice) html += `<p class="warn">${esc(res.advice)}</p>`;
  if (res.handoff) html += `<p class="warn">${esc(res.handoff)}</p>`;
  html += `<h3>The log this produced</h3><pre>${esc(res.log)}</pre>`;
  if (res.error) html += `<div class="result bad"><p class="warn">${esc(res.error)}</p></div>`;
  else html += costHtml(res);
  $("genout").innerHTML = html;
}

async function runLog() {
  const chosen = {};
  route.chosen.forEach(f => {
    const el = document.getElementById("ch_" + f.name);
    if (el && el.value.trim()) chosen[f.name] = el.value;
  });
  const res = await (await fetch("/api/problem/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      problem: problem.key, route: route.key, chosen,
      path: $("logpath").value.trim(), text: $("logtext").value,
    }),
  })).json();

  if (res.error) {
    $("logout").innerHTML = `<div class="result bad"><b>Cannot cost this</b>
      <p class="warn">${esc(res.error)}</p></div>`;
    return;
  }
  $("logout").innerHTML = costHtml(res);
}

$("modes").querySelectorAll("button").forEach(b => b.onclick = () => {
  const mode = b.dataset.mode;
  $("modes").querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  document.querySelector("nav").hidden = mode === "build";
  $("detail").hidden = mode !== "browse";
  $("builder").hidden = mode !== "build";
  $("problems").hidden = mode !== "problems";
  $("filter").hidden = mode !== "browse";
  if (mode === "build" && !spec) boot_build();
  if (mode === "browse") { drawList(); if (!current) select("QSearch"); }
  if (mode === "problems") drawProblemList();
});

$("detail").hidden = true;
$("filter").hidden = true;
boot();
boot_problems();
</script>
</body>
</html>
